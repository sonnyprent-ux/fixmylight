[project]
name = "fixmylight"
version = "0.1.0"
description = "Open-source, accessible reporting of broken traffic lights with polite daily follow-ups."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[project.optional-dependencies]
ai = ["anthropic>=0.40"]
server = ["gunicorn>=22"]
dev = ["pytest>=8"]

[project.scripts]
fixmylight = "fixmylight.cli:main"

[tool.setuptools]
packages = ["fixmylight"]

[tool.setuptools.package-data]
fixmylight = ["templates/*.html", "static/*"]
